name: Build Schleim OS Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'extension/standalone/schleim-os-standalone.html'
      - '.github/workflows/android-release.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schleim-os-android-apk
  cancel-in-progress: false

jobs:
  build-android:
    name: Build and validate Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The old unqualified "tools" SDK package was removed by Google.
          # Install only the current platform, build tools and platform tools.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Resolve stable GeckoView version
        id: geckoview
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import urllib.request, xml.etree.ElementTree as ET
          from urllib.error import HTTPError, URLError

          # The current stable artifact is published as "geckoview".
          # The old workflow queried the non-existent geckoview-stable metadata path.
          url = "https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/maven-metadata.xml"
          fallback = "160.0.20261116130455"
          try:
              request = urllib.request.Request(url, headers={"User-Agent": "Schleim-OS-Android-Build"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  root = ET.fromstring(response.read())
              version = root.findtext("./versioning/release") or root.findtext("./versioning/latest")
              if not version:
                  versions = [v.text for v in root.findall("./versioning/versions/version") if v.text]
                  version = versions[-1] if versions else None
              if not version:
                  raise RuntimeError("Maven metadata contains no version")
          except (HTTPError, URLError, TimeoutError, RuntimeError) as error:
              print(f"::warning::Could not read GeckoView Maven metadata ({error}); using verified stable fallback {fallback}")
              version = fallback

          if not version or not version[0].isdigit():
              raise SystemExit(f"Invalid GeckoView version: {version!r}")
          print("version=" + version)
          PY
          echo "Using GeckoView ${{ steps.geckoview.outputs.version }}"

      - name: Copy current standalone demo into Android assets
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets
          cp extension/standalone/schleim-os-standalone.html android/app/src/main/assets/start.html
          test -s android/app/src/main/assets/start.html

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: |
          gradle --no-daemon --stacktrace -PgeckoviewVersion=${{ steps.geckoview.outputs.version }} :app:assembleDebug

      - name: Validate APK output
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "package: name='de.schneckeschneck.schleimos.debug'"
          cp "$APK" "Schleim-OS-Android-0.1.0-alpha01-debug.apk"
          echo "APK built and package metadata validated."

      - name: Select target release
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "Schleim-OS-Android-0.1.0-alpha01-debug.apk" \
            --repo "$GITHUB_REPOSITORY" --clobber
