name: Build Schleim Browser Android APK

on:
  # Publish the consolidated 3.18.0 release only when all documentation,
  # project files and template tooling have been committed.
  push:
    branches: [main]
    paths:
      - 'Android-App/release-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schleim-os-android-apk
  cancel-in-progress: false

jobs:
  build-android:
    name: Build and validate Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The old unqualified "tools" SDK package was removed by Google.
          # Install only the current platform, build tools and platform tools.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Select API 36.1 compatible GeckoView
        id: geckoview
        shell: bash
        run: |
          set -euo pipefail
          VERSION="153.0.20260810162159"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using pinned GeckoView $VERSION (API 36.1 compatible dependency set)."
      - name: Bundle the original Schleim OS extension for GeckoView
        shell: bash
        run: |
          set -euo pipefail
          ASSET_DIR="android/app/src/main/assets/extension"
          rm -rf "$ASSET_DIR"
          mkdir -p "$ASSET_DIR"
          cp -a extension/. "$ASSET_DIR/"

          # Keep the Chrome source manifest untouched. This Android-only copy
          # gets the Gecko extension ID and Firefox-compatible MV3 background
          # script fallback required by GeckoView.
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path("android/app/src/main/assets/extension/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          manifest["browser_specific_settings"] = {
              "gecko": {
                  "id": "schleim-os-android@schneckeschneck.de"
              }
          }
          manifest["permissions"] = list(dict.fromkeys(
              manifest.get("permissions", []) + ["geckoViewAddons", "nativeMessaging"]
          ))

          background = manifest.get("background") or {}
          service_worker = background.pop("service_worker", None)
          if service_worker:
              background["scripts"] = [service_worker]
          if background:
              manifest["background"] = background

          # GeckoView/Firefox has no Chrome offscreen-document API.
          manifest["permissions"] = [
              permission for permission in manifest.get("permissions", [])
              if permission != "offscreen"
          ]
          manifest.pop("minimum_chrome_version", None)

          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + chr(10),
              encoding="utf-8"
          )

          assert manifest["manifest_version"] == 3
          assert "pages/newtab.html" == manifest["chrome_url_overrides"]["newtab"]
          assert "scripts/media-upload-worker.js" in manifest["background"]["scripts"]
          assert "offscreen" not in manifest.get("permissions", [])
          assert "nativeMessaging" in manifest.get("permissions", [])
          assert Path("android/app/src/main/assets/extension/pages/newtab.html").is_file()
          print("Original Schleim OS extension bundled; Android-specific Gecko manifest prepared.")
          PY

          test -s "$ASSET_DIR/manifest.json"
          test -s "$ASSET_DIR/pages/newtab.html"
          test -s "$ASSET_DIR/scripts/media-upload-worker.js"
          test ! -e "android/app/src/main/assets/camera/camera-host.html"
          test ! -e "android/app/src/main/java/de/schneckeschneck/schleimos/CameraCaptureActivity.kt"
          test ! -e "android/app/src/main/assets/camera/camera.html"
          node --check "$ASSET_DIR/scripts/app.js"
          node --check "$ASSET_DIR/scripts/schleim-account.js"
          node --check "$ASSET_DIR/scripts/personalization.js"
          node --check "$ASSET_DIR/scripts/slime-store-admin.js"
          node --check "$ASSET_DIR/scripts/media-upload-worker.js"
          node --check "$ASSET_DIR/scripts/schleim-photos-cloud.js"
          python3 - <<'PY'
          from pathlib import Path
          import json

          bundle_manifest = json.loads(Path("android/app/src/main/assets/extension/manifest.json").read_text())
          assert "geckoViewAddons" in bundle_manifest.get("permissions", [])
          assert "nativeMessaging" in bundle_manifest.get("permissions", [])

          main = Path("android/app/src/main/java/de/schneckeschneck/schleimos/MainActivity.kt").read_text()
          assert "onNewSession" not in main
          assert "request.target == GeckoSession.NavigationDelegate.TARGET_WINDOW_NEW" in main
          assert "createTab(uri)" in main
          assert "displayedSession" in main
          assert "CameraCaptureActivity" not in main
          assert '"camera.capture"' not in main
          assert "callback.reject()" in main
          assert main.count("callback.reject()") >= 2
          assert "onAndroidPermissionsRequest" in main
          assert "onMediaPermissionRequest" in main
          assert "callback.grant(videoSource, audioSource)" not in main
          assert "requestAndroidPermissions(" not in main

          android_manifest = Path("android/app/src/main/AndroidManifest.xml").read_text()
          assert ".CameraCaptureActivity" not in android_manifest
          assert "android.permission.CAMERA" not in android_manifest
          assert "android.permission.RECORD_AUDIO" not in android_manifest
          assert "android.hardware.camera" not in android_manifest

          gradle = Path("android/app/build.gradle.kts").read_text()
          assert "androidx.webkit" not in gradle
          assert "versionCode = 27" in gradle
          assert 'versionName = "0.1.0-alpha27"' in gradle
          assert '"version": "3.18.0"' in Path("extension/manifest.json").read_text()
          assert Path("Android-App/tools/build_template.py").is_file()
          assert 'applicationId = "de.schneckeschneck.schleimbrowser"' in gradle
          assert 'android:label="Schleim Browser"' in android_manifest
          assert 'android:icon="@mipmap/ic_launcher"' in android_manifest
          assert Path("android/app/src/main/file_00000000f7dc8210993324a486df07ef.png").is_file()
          assert '"file.save" -> saveFileFromExtension(payload)' in main
          assert "ACTION_CREATE_DOCUMENT" in main
          assert "REQUEST_SAVE_FILE" in main
          account_script = Path("extension/scripts/schleim-account.js").read_text()
          assert "globalThis.browser?.storage?.local" in account_script
          assert "confirmAction(t('confirmRestore')" in account_script
          photos_script = Path("extension/scripts/schleim-photos-cloud.js").read_text()
          assert "function isAndroidGeckoView()" in photos_script
          assert "await uploadOne(file,description)" in photos_script
          assert photos_script.count("const target = statusSelector || '[data-photos-status]'") == 1
          assert "androidStatusTarget" not in photos_script
          assert "setStatus(target,t('uploading')" in photos_script
          admin_script = Path("extension/scripts/slime-store-admin.js").read_text()
          assert "SSOS_SAVE_FILE" in admin_script
          worker = Path("extension/scripts/media-upload-worker.js").read_text()
          assert "SSOS_SAVE_FILE" in worker
          personalization = Path("extension/scripts/personalization.js").read_text()
          assert "await confirmAction(st('confirmUninstall')" in personalization
          assert "globalThis.browser?.runtime?.id" in personalization

          camera = Path("extension/scripts/schleim-photos-cloud.js").read_text()
          assert "navigator.mediaDevices.getUserMedia" in camera
          assert "new MediaRecorder" in camera
          assert "captureWithAndroidWebCamera" not in camera
          assert "camera.capture" not in camera
          assert "data-camera-native-photo" not in camera
          assert "data-camera-native-video" not in camera
          assert "data-camera-start" in camera
          assert "data-camera-stop" in camera
          assert "data-camera-switch" in camera
          assert "data-camera-photo" in camera
          assert "data-camera-record" in camera
          assert "data-android-camera-notice" in camera
          camera_mount = camera[camera.index("function mountCamera()"):camera.index("async function startBrowserCamera()")]
          assert "androidNotice.hidden = !isAndroidApplication" in camera_mount
          assert "browserPanel.hidden = isAndroidApplication" in camera_mount
          assert "if (isAndroidApplication)" in camera_mount
          assert "stopBrowserCamera()" in camera_mount

          markup = Path("extension/scripts/app.js").read_text()
          assert "data-android-camera-notice" in markup
          assert "Android-Anwendung – Kamera" in markup
          assert "Original-Extension – Webkamera" in markup
          assert 'aria-labelledby="ssos-camera-android-heading"' in markup
          assert 'aria-labelledby="ssos-camera-browser-heading"' in markup
          assert "Foto- und Videoaufnahmen werden in der Schleim-OS-Android-App nicht unterstützt" in markup
          assert "data-browser-camera-panel" in markup
          assert "Kamera starten" in markup
          assert "Kamera deaktivieren" in markup
          assert "Foto aufnehmen" in markup
          assert "Video aufnehmen" in markup
          assert "data-native-camera-panel" not in markup

          css = Path("extension/styles/personalization.css").read_text()
          assert ".ssos-camera-android-card" in css
          assert ".ssos-camera-native-card" not in css

          assert not Path("android/app/src/main/java/de/schneckeschneck/schleimos/CameraCaptureActivity.kt").exists()
          assert not Path("android/app/src/main/assets/camera/camera.html").exists()
          assert 'type = if (allowedMimeTypes.size > 1) "*/*"' in main
          assert "putExtra(Intent.EXTRA_MIME_TYPES, allowedMimeTypes)" in main
          assert 'applicationId = "de.schneckeschneck.schleimbrowser"' in gradle
          assert "private fun navigate(input: String)" in main
          assert "previous.setActive(false)" in main
          assert "session.setActive(true)" in main
          assert "override fun onPause()" in main
          assert "activeSession()?.let { session ->" in main
          assert "override fun onResume()" in main
          assert "private val ioExecutor = Executors.newFixedThreadPool(2)" in main
          assert "ioExecutor.execute {" in main
          assert "private fun pruneBackgroundTabsForNewTab()" in main
          assert "private const val MAX_OPEN_TABS = 4" in main
          assert "PERMISSION_MEDIA_KEY_SYSTEM_ACCESS" in main
          assert "GeckoSession.PermissionDelegate.ContentPermission.VALUE_ALLOW" in main
          assert "private fun checkForAppUpdates(" in main
          assert "UPDATE_METADATA_ASSET" in main
          assert "MessageDigest.getInstance(\"SHA-256\")" in main
          assert "Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES" in main
          assert "android.permission.REQUEST_INSTALL_PACKAGES" in Path("android/app/src/main/AndroidManifest.xml").read_text()
          assert "Content providers (cloud drives, file managers, USB storage) may take" in main
          assert "geckoView.post {" in main
          assert "runtime = GeckoRuntime.create(this)" in main
          assert "ioExecutor.execute {" in main
          assert "displayNameForUri(uri)" in main
          assert "private const val MAX_DOWNLOAD_ROWS = 100" in main
          assert "https://www.google.com/search?q=" in main
          assert "private fun toggleDesktopMode()" in main
          assert "private fun showDownloadsDialog()" in main
          assert "private fun showExtensionsDialog()" in main
          assert "private fun showSettingsDialog()" in main
          assert "override fun onContextMenu(" in main
          assert "GeckoWebExecutor(runtime).fetch(request.build())" in main
          assert "private fun printCurrentPage()" in main
          assert "session.printPageContent()" in main
          assert "optionsPageUrl" in main
          assert "private fun showPageElementContextMenu(" in main
          assert 'addAction("Seite drucken") { printPage(session) }' in main
          assert 'makeTextButton("Öffnen")' in main
          assert 'makeWideActionButton("Mozilla Firefox Add-ons öffnen")' in main
          assert 'load("https://addons.mozilla.org/firefox/")' in main
          assert "setActivityContextDelegate" in main
          assert main.count('makeTextButton("Entfernen")') == 1
          assert main.count("override fun onContextMenu(") == 1
          assert main.count("private fun printCurrentPage()") == 1
          assert "session.printPageContent()" in main
          assert "PopupMenu(this, anchor, Gravity.START)" in main
          assert "downloadContextResource(session, linkUri)" in main
          assert "WebExtensionController" in main
          assert "optionsPageUrl" in main
          assert "homepageUrl" in main
          assert "onExternalResponse(session: GeckoSession, response: WebResponse)" in main
          assert "WebExtensionController.INSTALLATION_METHOD_FROM_FILE" in main
          assert "GeckoSessionSettings.USER_AGENT_MODE_DESKTOP" in main
          assert "onCanGoBack(session: GeckoSession, canGoBack: Boolean)" in main
          assert "onCanGoForward(session: GeckoSession, canGoForward: Boolean)" in main
          provider = Path("android/app/src/main/AndroidManifest.xml").read_text()
          assert "androidx.core.content.FileProvider" in provider
          assert '@xml/file_paths' in provider
          file_paths = Path("android/app/src/main/res/xml/file_paths.xml").read_text()
          assert 'path="Download/"' in file_paths
          print("Compact browser UI, Google search, tab navigation, downloads, XPI extension manager and Android settings validated. Camera capture remains disabled.")
          print("Android camera removed; original extension JavaScript webcam and its controls retained. Android media capture is explicitly rejected.")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare persistent Android release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 repository secret." >&2; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/schleim-release.jks"
          test -s "$RUNNER_TEMP/schleim-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/schleim-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          gradle --no-daemon --stacktrace -PgeckoviewVersion=${{ steps.geckoview.outputs.version }} :app:assembleRelease

      - name: Validate APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "Release APK missing or empty: $APK" >&2; exit 1; }
          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

          # Do not pipe aapt/unzip/apksigner into grep -q under pipefail:
          # grep may exit early and make the producer fail with SIGPIPE (141).
          APK_BADGING="$("$AAPT" dump badging "$APK")"
          if [[ "$APK_BADGING" != *"package: name='de.schneckeschneck.schleimbrowser'"* ]]; then
            echo "Unexpected APK applicationId. Expected de.schneckeschneck.schleimbrowser." >&2
            printf '%s\n' "$APK_BADGING" | head -n 5 >&2
            exit 1
          fi

          APK_CONTENTS="$(unzip -Z1 "$APK")"
          for required in \
            "assets/extension/manifest.json" \
            "assets/extension/pages/newtab.html" \
            "ic_launcher.png"; do
            if [[ "$APK_CONTENTS" != *"$required"* ]]; then
              echo "Required file is missing from APK: $required" >&2
              exit 1
            fi
          done

          cmp -s "android/app/src/main/file_00000000f7dc8210993324a486df07ef.png" "android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png" || {
            echo "Launcher icon differs from the repository source image." >&2
            exit 1
          }

          SIGNATURE_INFO="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$SIGNATURE_INFO"
          CERT="$(sed -n 's/^.*certificate SHA-256 digest: //p' <<< "$SIGNATURE_INFO")"
          if [[ -z "$CERT" ]]; then
            echo "Could not read the APK signing certificate SHA-256 digest." >&2
            exit 1
          fi
          if [[ "$CERT" != "9f06dbb31fd2fdaca50e75e72bb55076433882265aa31136c3434f9e633f53b2" ]]; then
            echo "APK was signed with an unexpected certificate: $CERT" >&2
            exit 1
          fi

          cp "$APK" "Schleim-Browser-Android-0.1.0-alpha27.apk"
          echo "Signed release APK built, package metadata and persistent signing certificate validated."

      - name: Publish APK as a downloadable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Schleim-Browser-Android-APK
          path: Schleim-Browser-Android-0.1.0-alpha27.apk
          if-no-files-found: error
          retention-days: 30

      - name: Compose release notes in German, English and Dutch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          {
            printf '## 🇩🇪 Deutsch\n\n'
            cat docs/Deutsch/RELEASE-NOTES-3.18.0.md
            printf '\n\n---\n\n## 🇬🇧 English\n\n'
            cat docs/Englisch/RELEASE-NOTES-3.18.0.md
            printf '\n\n---\n\n## 🇳🇱 Nederlands\n\n'
            cat docs/Niederländisch/RELEASE-NOTES-3.18.0.md
          } > dist/release-notes.md
          test -s dist/release-notes.md

      - name: Prepare Schleim OS 3.18.0 release
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v3.18.0"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Schleim OS 3.18.0 – Android-Browser" \
              --notes-file dist/release-notes.md
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Package Extension and Android Studio template
        env:
          GECKOVIEW_VERSION: ${{ steps.geckoview.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf dist/release dist/android-template
          mkdir -p dist/release

          (cd extension && zip -qr "$GITHUB_WORKSPACE/dist/release/Schleim-OS-Extension.zip" .)
          (cd extension-template && zip -qr "$GITHUB_WORKSPACE/dist/release/Browser-OS-Extension-Template.zip" .)

          python3 Android-App/tools/build_template.py \
            --android android \
            --extension extension \
            --docs Android-App \
            --output dist/android-template

          TEMPLATE_PROJECT="dist/android-template/Android-App Template"
          gradle --no-daemon --stacktrace \
            -p "$TEMPLATE_PROJECT" \
            wrapper --gradle-version 8.13 --distribution-type bin

          # Build the generated, placeholder-only project once as a release check.
          gradle --no-daemon --stacktrace \
            -p "$TEMPLATE_PROJECT" \
            -PgeckoviewVersion="$GECKOVIEW_VERSION" \
            :app:assembleDebug

          # The build above verifies that the template compiles. Do not ship its
          # generated APKs, Gradle caches or build intermediates in the source ZIP.
          find "$TEMPLATE_PROJECT" -type d \
            \( -name build -o -name .gradle -o -name .kotlin \) -prune -exec rm -rf {} +
          find "$TEMPLATE_PROJECT" -type f \
            \( -name '*.apk' -o -name '*.aab' -o -name '*.hprof' \) -delete
          rm -f "$TEMPLATE_PROJECT/local.properties"

          (cd dist/android-template && zip -qr "$GITHUB_WORKSPACE/dist/release/Schleim-Browser-Android-Studio-Template.zip" "Android-App Template")
          TEMPLATE_SIZE="$(stat -c%s dist/release/Schleim-Browser-Android-Studio-Template.zip)"
          if (( TEMPLATE_SIZE > 30000000 )); then
            echo "Android Studio source template is unexpectedly large: $TEMPLATE_SIZE bytes" >&2
            exit 1
          fi
          TEMPLATE_CONTENTS="$(unzip -Z1 dist/release/Schleim-Browser-Android-Studio-Template.zip)"
          if [[ "$TEMPLATE_CONTENTS" =~ (^|/)(build|[.]gradle|[.]kotlin)/|[.](apk|aab|hprof)$ ]]; then
            echo "Generated build output or cache was found in the Android Studio template ZIP." >&2
            exit 1
          fi

          # Copy the separately validated production APK into the release package.
          cp "Schleim-Browser-Android-0.1.0-alpha27.apk" dist/release/

          APK_NAME="Schleim-Browser-Android-0.1.0-alpha27.apk"
          APK_SHA256="$(sha256sum "dist/release/$APK_NAME" | awk '{print $1}')"
          python3 - <<PY
          import json
          from pathlib import Path
          Path("dist/release/Schleim-Browser-Android-update.json").write_text(json.dumps({
              "packageName": "de.schneckeschneck.schleimbrowser",
              "versionCode": 27,
              "versionName": "0.1.0-alpha27",
              "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/v3.18.0/${APK_NAME}",
              "sha256": "${APK_SHA256}"
          }, indent=2) + "\n", encoding="utf-8")
          PY

          (
            cd dist/release
            sha256sum \
              Schleim-OS-Extension.zip \
              Browser-OS-Extension-Template.zip \
              Schleim-Browser-Android-0.1.0-alpha27.apk \
              Schleim-Browser-Android-update.json \
              Schleim-Browser-Android-Studio-Template.zip \
              > Schleim-OS-SHA256SUMS.txt
          )

          unzip -t dist/release/Schleim-OS-Extension.zip >/dev/null
          unzip -t dist/release/Browser-OS-Extension-Template.zip >/dev/null
          unzip -t dist/release/Schleim-Browser-Android-Studio-Template.zip >/dev/null
          TEMPLATE_CONTENTS="$(unzip -Z1 dist/release/Schleim-Browser-Android-Studio-Template.zip)"
          [[ "$TEMPLATE_CONTENTS" == *"Android-App Template/app/build.gradle.kts"* ]] || {
            echo "Android Studio template is missing its app/build.gradle.kts file." >&2
            exit 1
          }
          if [[ "$TEMPLATE_CONTENTS" == Android-App/* ]]; then
            echo "Unexpected old Android-App ZIP root folder found." >&2
            exit 1
          fi
          echo "All project archives and the Alpha 27 APK are ready; the Android Studio ZIP root is Android-App Template."

      - name: Publish the complete 3.18.0 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          # Keep only the current Android APK in this consolidated release.
          gh release delete-asset "$TAG" "Schleim-Browser-Android-0.1.0-alpha22.apk" \
            --repo "$GITHUB_REPOSITORY" --yes || true
          gh release delete-asset "$TAG" "Schleim-Browser-Android-0.1.0-alpha24.apk" \
            --repo "$GITHUB_REPOSITORY" --yes || true
          gh release delete-asset "$TAG" "Schleim-Browser-Android-0.1.0-alpha25.apk" \
            --repo "$GITHUB_REPOSITORY" --yes || true
          gh release delete-asset "$TAG" "Schleim-Browser-Android-0.1.0-alpha26.apk" \
            --repo "$GITHUB_REPOSITORY" --yes || true
          gh release delete-asset "$TAG" "Schleim-Browser-Android-0.1.0-alpha27.apk" \
            --repo "$GITHUB_REPOSITORY" --yes || true
          gh release upload "$TAG" \
            "dist/release/Schleim-OS-Extension.zip" \
            "dist/release/Browser-OS-Extension-Template.zip" \
            "dist/release/Schleim-Browser-Android-0.1.0-alpha27.apk" \
            "dist/release/Schleim-Browser-Android-update.json" \
            "dist/release/Schleim-Browser-Android-Studio-Template.zip" \
            "dist/release/Schleim-OS-SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" --clobber

          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Schleim OS 3.18.0" \
            --notes-file dist/release-notes.md

      - name: Verify the exact files published to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist/verify
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Schleim-OS-Extension.zip" \
            --pattern "Browser-OS-Extension-Template.zip" \
            --pattern "Schleim-Browser-Android-0.1.0-alpha27.apk" \
            --pattern "Schleim-Browser-Android-update.json" \
            --pattern "Schleim-Browser-Android-Studio-Template.zip" \
            --pattern "Schleim-OS-SHA256SUMS.txt" \
            --dir dist/verify

          (
            cd dist/verify
            sha256sum -c Schleim-OS-SHA256SUMS.txt
          )

          for asset in \
            Schleim-OS-Extension.zip \
            Browser-OS-Extension-Template.zip \
            Schleim-Browser-Android-0.1.0-alpha27.apk \
            Schleim-Browser-Android-update.json \
            Schleim-Browser-Android-Studio-Template.zip; do
            cmp -s "dist/release/$asset" "dist/verify/$asset"
          done

