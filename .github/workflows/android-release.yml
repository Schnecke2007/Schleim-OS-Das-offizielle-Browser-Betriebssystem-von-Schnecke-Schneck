name: Build Schleim OS Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'extension/standalone/schleim-os-standalone.html'
      - '.github/workflows/android-release.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schleim-os-android-apk
  cancel-in-progress: false

jobs:
  build-android:
    name: Build and validate Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The old unqualified "tools" SDK package was removed by Google.
          # Install only the current platform, build tools and platform tools.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Select API 36.1 compatible GeckoView
        id: geckoview
        shell: bash
        run: |
          set -euo pipefail
          VERSION="153.0.20260810162159"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using pinned GeckoView $VERSION (API 36.1 compatible dependency set)."
      - name: Copy current standalone demo into Android assets
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets
          cp extension/standalone/schleim-os-standalone.html android/app/src/main/assets/start.html
          test -s android/app/src/main/assets/start.html

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: android
        run: |
          gradle --no-daemon --stacktrace -PgeckoviewVersion=${{ steps.geckoview.outputs.version }} :app:assembleDebug

      - name: Validate APK output
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "package: name='de.schneckeschneck.schleimos.debug'"
          unzip -l "$APK" | grep -Fq "assets/start.html"
          cp "$APK" "Schleim-OS-Android-0.1.0-alpha01-debug.apk"
          echo "APK built, package metadata validated and bundled start page found."

      - name: Publish APK as a downloadable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Schleim-OS-Android-APK
          path: Schleim-OS-Android-0.1.0-alpha01-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Select target release
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "Schleim-OS-Android-0.1.0-alpha01-debug.apk" \
            --repo "$GITHUB_REPOSITORY" --clobber
