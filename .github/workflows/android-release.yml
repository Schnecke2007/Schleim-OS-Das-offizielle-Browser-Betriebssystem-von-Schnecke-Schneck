name: Build Schleim OS Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'extension/**'
      - '.github/workflows/android-release.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schleim-os-android-apk
  cancel-in-progress: false

jobs:
  build-android:
    name: Build and validate Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The old unqualified "tools" SDK package was removed by Google.
          # Install only the current platform, build tools and platform tools.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Select API 36.1 compatible GeckoView
        id: geckoview
        shell: bash
        run: |
          set -euo pipefail
          VERSION="153.0.20260810162159"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using pinned GeckoView $VERSION (API 36.1 compatible dependency set)."
      - name: Bundle the original Schleim OS extension for GeckoView
        shell: bash
        run: |
          set -euo pipefail
          ASSET_DIR="android/app/src/main/assets/extension"
          rm -rf "$ASSET_DIR"
          mkdir -p "$ASSET_DIR"
          cp -a extension/. "$ASSET_DIR/"

          # Keep the Chrome source manifest untouched. This Android-only copy
          # gets the Gecko extension ID and Firefox-compatible MV3 background
          # script fallback required by GeckoView.
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path("android/app/src/main/assets/extension/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          manifest["browser_specific_settings"] = {
              "gecko": {
                  "id": "schleim-os-android@schneckeschneck.de"
              }
          }

          background = manifest.get("background") or {}
          service_worker = background.pop("service_worker", None)
          if service_worker:
              background["scripts"] = [service_worker]
          if background:
              manifest["background"] = background

          # GeckoView/Firefox has no Chrome offscreen-document API.
          manifest["permissions"] = [
              permission for permission in manifest.get("permissions", [])
              if permission != "offscreen"
          ]
          manifest.pop("minimum_chrome_version", None)

          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + chr(10),
              encoding="utf-8"
          )

          assert manifest["manifest_version"] == 3
          assert "pages/newtab.html" == manifest["chrome_url_overrides"]["newtab"]
          assert "scripts/media-upload-worker.js" in manifest["background"]["scripts"]
          assert "offscreen" not in manifest.get("permissions", [])
          assert Path("android/app/src/main/assets/extension/pages/newtab.html").is_file()
          print("Original Schleim OS extension bundled; Android-specific Gecko manifest prepared.")
          PY

          test -s "$ASSET_DIR/manifest.json"
          test -s "$ASSET_DIR/pages/newtab.html"
          test -s "$ASSET_DIR/scripts/media-upload-worker.js"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: android
        run: |
          gradle --no-daemon --stacktrace -PgeckoviewVersion=${{ steps.geckoview.outputs.version }} :app:assembleDebug

      - name: Validate APK output
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "package: name='de.schneckeschneck.schleimos.debug'"
          unzip -l "$APK" | grep -Fq "assets/extension/manifest.json"
          unzip -l "$APK" | grep -Fq "assets/extension/pages/newtab.html"
          cp "$APK" "Schleim-OS-Android-0.1.0-alpha01-debug.apk"
          echo "APK built, package metadata validated and original extension resources found."

      - name: Publish APK as a downloadable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Schleim-OS-Android-APK
          path: Schleim-OS-Android-0.1.0-alpha01-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Select target release
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "Schleim-OS-Android-0.1.0-alpha01-debug.apk" \
            --repo "$GITHUB_REPOSITORY" --clobber
