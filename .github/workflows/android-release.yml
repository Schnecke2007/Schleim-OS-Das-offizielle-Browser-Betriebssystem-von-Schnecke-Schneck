name: Build Schleim OS Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'extension/**'
      - '.github/workflows/android-release.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schleim-os-android-apk
  cancel-in-progress: false

jobs:
  build-android:
    name: Build and validate Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The old unqualified "tools" SDK package was removed by Google.
          # Install only the current platform, build tools and platform tools.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Select API 36.1 compatible GeckoView
        id: geckoview
        shell: bash
        run: |
          set -euo pipefail
          VERSION="153.0.20260810162159"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using pinned GeckoView $VERSION (API 36.1 compatible dependency set)."
      - name: Bundle the original Schleim OS extension for GeckoView
        shell: bash
        run: |
          set -euo pipefail
          ASSET_DIR="android/app/src/main/assets/extension"
          rm -rf "$ASSET_DIR"
          mkdir -p "$ASSET_DIR"
          cp -a extension/. "$ASSET_DIR/"

          # Keep the Chrome source manifest untouched. This Android-only copy
          # gets the Gecko extension ID and Firefox-compatible MV3 background
          # script fallback required by GeckoView.
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path("android/app/src/main/assets/extension/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          manifest["browser_specific_settings"] = {
              "gecko": {
                  "id": "schleim-os-android@schneckeschneck.de"
              }
          }
          manifest["permissions"] = list(dict.fromkeys(
              manifest.get("permissions", []) + ["geckoViewAddons", "nativeMessaging"]
          ))

          background = manifest.get("background") or {}
          service_worker = background.pop("service_worker", None)
          if service_worker:
              background["scripts"] = [service_worker]
          if background:
              manifest["background"] = background

          # GeckoView/Firefox has no Chrome offscreen-document API.
          manifest["permissions"] = [
              permission for permission in manifest.get("permissions", [])
              if permission != "offscreen"
          ]
          manifest.pop("minimum_chrome_version", None)

          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + chr(10),
              encoding="utf-8"
          )

          assert manifest["manifest_version"] == 3
          assert "pages/newtab.html" == manifest["chrome_url_overrides"]["newtab"]
          assert "scripts/media-upload-worker.js" in manifest["background"]["scripts"]
          assert "offscreen" not in manifest.get("permissions", [])
          assert "nativeMessaging" in manifest.get("permissions", [])
          assert Path("android/app/src/main/assets/extension/pages/newtab.html").is_file()
          print("Original Schleim OS extension bundled; Android-specific Gecko manifest prepared.")
          PY

          test -s "$ASSET_DIR/manifest.json"
          test -s "$ASSET_DIR/pages/newtab.html"
          test -s "$ASSET_DIR/scripts/media-upload-worker.js"
          test ! -e "android/app/src/main/assets/camera/camera-host.html"
          test -s "android/app/src/main/java/de/schneckeschneck/schleimos/CameraCaptureActivity.kt"
          test -s "android/app/src/main/assets/camera/camera.html"
          node --check "$ASSET_DIR/scripts/app.js"
          node --check "$ASSET_DIR/scripts/schleim-photos-cloud.js"
          python3 - <<'PY'
          from pathlib import Path
          import json
          bundle_manifest = json.loads(Path("android/app/src/main/assets/extension/manifest.json").read_text())
          assert "geckoViewAddons" in bundle_manifest.get("permissions", [])
          assert "nativeMessaging" in bundle_manifest.get("permissions", [])
          main = Path("android/app/src/main/java/de/schneckeschneck/schleimos/MainActivity.kt").read_text()
          assert "onNewSession" not in main
          assert "request.target == GeckoSession.NavigationDelegate.TARGET_WINDOW_NEW" in main
          assert "createTab(uri)" in main
          assert "displayedSession" in main
          assert "private fun requestAndroidPermissions(" in main
          assert "callback.grant(videoSource, audioSource)" in main
          assert "MediaSource.TYPE_VIDEO" in main
          assert '"camera.capture"' in main
          assert "CameraCaptureActivity::class.java" in main
          assert "finishAndroidCameraCapture(resultCode, data)" in main
          assert "MAX_CAMERA_CAPTURE_BYTES" in main
          assert "MediaStore.ACTION_IMAGE_CAPTURE" not in main
          assert "MediaStore.ACTION_VIDEO_CAPTURE" not in main
          camera_activity_path = Path("android/app/src/main/java/de/schneckeschneck/schleimos/CameraCaptureActivity.kt")
          assert camera_activity_path.is_file()
          camera_activity = camera_activity_path.read_text()
          assert "WebViewAssetLoader" in camera_activity
          assert "WebChromeClient" in camera_activity
          assert "onPermissionRequest" in camera_activity
          assert "PermissionRequest.RESOURCE_VIDEO_CAPTURE" in camera_activity
          assert "PermissionRequest.RESOURCE_AUDIO_CAPTURE" in camera_activity
          assert "https://appassets.androidplatform.net/assets/camera/camera.html" in camera_activity
          assert "@JavascriptInterface" in camera_activity
          assert "appendCaptureChunk" in camera_activity
          assert "EXTRA_FILE_PATH" in camera_activity
          assert "androidx.webkit:webkit:1.18.0" in Path("android/app/build.gradle.kts").read_text()
          assert "androidx.camera" not in Path("android/app/build.gradle.kts").read_text()
          camera_html_path = Path("android/app/src/main/assets/camera/camera.html")
          assert camera_html_path.is_file()
          camera_html = camera_html_path.read_text()
          assert "navigator.mediaDevices.getUserMedia" in camera_html
          assert "MediaRecorder" in camera_html
          assert "playsinline" in camera_html
          assert "bridge.beginCapture" in camera_html
          assert "bridge.appendCaptureChunk" in camera_html
          assert "LocalCameraServer" not in main
          assert not Path("android/app/src/main/java/de/schneckeschneck/schleimos/LocalCameraServer.kt").exists()
          assert not Path("android/app/src/main/assets/camera/camera-host.html").exists()
          camera = Path("extension/scripts/schleim-photos-cloud.js").read_text()
          assert "action:'camera.capture'" in camera
          assert "captureWithAndroidWebCamera('photo')" in camera
          assert "captureWithAndroidWebCamera('video')" in camera
          assert "const buttons = Array.from(document.querySelectorAll('[data-camera-native-photo],[data-camera-native-video]'));" in camera
          assert "for (const button of buttons) button.disabled = true;" in camera
          assert "buttons.forEach" not in camera
          assert "if (button.isConnected) button.disabled = false;" in camera
          assert "data-camera-native-photo" in camera
          assert "data-camera-native-video" in camera
          assert "camera.url" not in camera
          markup = Path("extension/scripts/app.js").read_text()
          assert "data-native-camera-panel" in markup
          assert "data-camera-host" not in markup
          android_manifest = Path("android/app/src/main/AndroidManifest.xml").read_text()
          assert 'android:name=".CameraCaptureActivity"' in android_manifest
          assert 'android:exported="false"' in android_manifest
          assert "FileProvider" not in android_manifest
          assert "android.media.action.IMAGE_CAPTURE" not in android_manifest
          assert "android.media.action.VIDEO_CAPTURE" not in android_manifest
          assert "runOnUiThread" in main
          assert "Looper.getMainLooper()" in main
          assert "queryIntentActivities" not in main
          assert "SAMSUNG_CAMERA_PACKAGE" not in main
          assert "androidx.camera" not in Path("android/app/build.gradle.kts").read_text()
          assert "showPermissionSettingsDialog" in main
          assert "androidCameraBusy" in camera
          assert 'type = if (allowedMimeTypes.size > 1) "*/*"' in main
          assert "putExtra(Intent.EXTRA_MIME_TYPES, allowedMimeTypes)" in main
          print("Secure-origin Android WebView, JavaScript getUserMedia/MediaRecorder, runtime camera/microphone permissions and chunked private-file transfer checks passed.")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: android
        run: |
          gradle --no-daemon --stacktrace -PgeckoviewVersion=${{ steps.geckoview.outputs.version }} :app:assembleDebug

      - name: Validate APK output
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "package: name='de.schneckeschneck.schleimos.debug'"
          unzip -l "$APK" | grep -Fq "assets/extension/manifest.json"
          unzip -l "$APK" | grep -Fq "assets/extension/pages/newtab.html"
          cp "$APK" "Schleim-OS-Android-0.1.0-alpha12-debug.apk"
          echo "APK built, package metadata validated and original extension resources found."

      - name: Publish APK as a downloadable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Schleim-OS-Android-APK
          path: Schleim-OS-Android-0.1.0-alpha12-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Select target release
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist/release
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Schleim-OS-Extension.zip" \
            --pattern "Browser-OS-Extension-Template.zip" \
            --dir dist/release
          cp "Schleim-OS-Android-0.1.0-alpha12-debug.apk" dist/release/

          (
            cd dist/release
            sha256sum \
              Schleim-OS-Extension.zip \
              Browser-OS-Extension-Template.zip \
              Schleim-OS-Android-0.1.0-alpha12-debug.apk \
              > Schleim-OS-SHA256SUMS.txt
          )

          # Remove the earlier demo-based Android APK so only the original-extension
          # Android build remains available in the release.
          gh release delete-asset "$TAG" "Schleim-OS-Android-0.1.0-alpha01-debug.apk" \
            --repo "$GITHUB_REPOSITORY" --yes || true
          gh release delete-asset "$TAG" "Schleim-OS-Android-0.1.0-alpha02-debug.apk" \
            --repo "$GITHUB_REPOSITORY" --yes || true
          gh release delete-asset "$TAG" "Schleim-OS-Android-0.1.0-alpha03-debug.apk" \
            --repo "$GITHUB_REPOSITORY" --yes || true
          gh release delete-asset "$TAG" "Schleim-OS-Android-0.1.0-alpha04-debug.apk" \
            --repo "$GITHUB_REPOSITORY" --yes || true
          gh release delete-asset "$TAG" "Schleim-OS-Android-0.1.0-alpha05-debug.apk" \
            --repo "$GITHUB_REPOSITORY" --yes || true

          gh release delete-asset "$TAG" "Schleim-OS-Android-0.1.0-alpha06-debug.apk" \
            --repo "$GITHUB_REPOSITORY" --yes || true

          gh release delete-asset "$TAG" "Schleim-OS-Android-0.1.0-alpha07-debug.apk" \
            --repo "$GITHUB_REPOSITORY" --yes || true

          gh release delete-asset "$TAG" "Schleim-OS-Android-0.1.0-alpha08-debug.apk" \
            --repo "$GITHUB_REPOSITORY" --yes || true

          gh release delete-asset "$TAG" "Schleim-OS-Android-0.1.0-alpha09-debug.apk" \
            --repo "$GITHUB_REPOSITORY" --yes || true

          gh release delete-asset "$TAG" "Schleim-OS-Android-0.1.0-alpha10-debug.apk" \
            --repo "$GITHUB_REPOSITORY" --yes || true

          gh release delete-asset "$TAG" "Schleim-OS-Android-0.1.0-alpha11-debug.apk" \
            --repo "$GITHUB_REPOSITORY" --yes || true

          gh release upload "$TAG" \
            "dist/release/Schleim-OS-Android-0.1.0-alpha12-debug.apk" \
            "dist/release/Schleim-OS-SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" --clobber
