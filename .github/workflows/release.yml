name: Build and publish Schleim OS release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'extension/**'
      - 'extension-template/**'
  schedule:
    # GitHub's shortest supported scheduled interval is five minutes.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schleim-os-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate template source and run navigation tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool extension-template/manifest.json > /dev/null
          python3 -m json.tool extension-template/data/store-apps.json > /dev/null
          python3 -m json.tool extension-template/data/store-ratings.json > /dev/null
          for file in extension-template/scripts/*.js; do
            node --check "$file"
          done
          for file in extension/scripts/*.js; do
            node --check "$file"
          done
          python3 - <<'PY'
          import pathlib, re
          for name in ["extension/standalone/schleim-os-standalone.html", "extension-template/standalone/browser-os-standalone.html"]:
              html = pathlib.Path(name).read_text(encoding="utf-8")
              blocks = [block for block in re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.I | re.S) if block.strip()]
              if not blocks:
                  raise SystemExit(f"No inline JavaScript found in {name}")
              pathlib.Path("/tmp/" + pathlib.Path(name).stem + ".js").write_text(max(blocks, key=len), encoding="utf-8")
          PY
          node --check /tmp/schleim-os-standalone.js
          node --check /tmp/browser-os-standalone.js
          node --test extension-template/tests/app-navigation.test.js
          python3 - <<'PY'
          import json, pathlib, re
          root = pathlib.Path("extension-template")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert manifest.get("background", {}).get("service_worker") == "scripts/media-upload-worker.js"
          assert (root / manifest["background"]["service_worker"]).is_file()
          assert (root / "scripts/media-upload-offscreen.js").is_file()
          html = (root / "pages/newtab.html").read_text(encoding="utf-8")
          for rel in re.findall(r'(?:src|href)="\.\./([^"]+)"', html):
              if rel.startswith(("scripts/", "styles/", "locales/", "assets/")):
                  assert (root / rel).is_file(), f"Missing template resource: {rel}"
          for lang in ("Deutsch", "Englisch", "Niederländisch"):
              assert (root / "docs" / lang / "README.md").is_file()
              assert (root / "docs" / "Leichte-Sprache" / lang / "README.md").is_file()
          required_docs = [
              "docs/Deutsch/KONTO-UND-CLOUD.md", "docs/Englisch/ACCOUNT-AND-CLOUD.md",
              "docs/Niederländisch/ACCOUNT-EN-PRIVECLOUD.md",
              "docs/Leichte-Sprache/Deutsch/KONTO-UND-CLOUD.md",
              "docs/Leichte-Sprache/Englisch/ACCOUNT-CLOUD.md",
              "docs/Leichte-Sprache/Niederländisch/ACCOUNT-CLOUD.md",
              "docs/Deutsch/EXTERNE-WEB-APP.md", "docs/Englisch/EXTERNAL-WEB-APP.md",
              "docs/Niederländisch/EXTERNE-WEB-APP.md"]
          for rel in required_docs:
              assert (root / rel).is_file(), f"Missing translated template document: {rel}"
          assert not (root / "docs/SONOS-APP.md").exists(), "Legacy provider-specific template doc must be removed"
          print("Template resources, manifest, translated guides and standalone structure validated.")
          PY

      - name: Detect whether this push changes the template
        id: template_changes
        env:
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          CHANGED=false
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$BEFORE" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            if ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- extension-template/; then
              CHANGED=true
            fi
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Template changed in this push: $CHANGED"

      - name: Read and validate versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool extension/manifest.json > /dev/null
          python3 -m json.tool extension-template/manifest.json > /dev/null

          VERSION="$(python3 -c 'import json; print(json.load(open("extension/manifest.json", encoding="utf-8"))["version"])')"
          TEMPLATE_VERSION="$(python3 -c 'import json; print(json.load(open("extension-template/manifest.json", encoding="utf-8"))["version"])')"
          NOTES_DE="extension/docs/RELEASE-NOTES-${VERSION}.md"
          NOTES_EN="docs/Englisch/RELEASE-NOTES-${VERSION}.md"
          NOTES_NL="docs/Niederländisch/RELEASE-NOTES-${VERSION}.md"

          if [[ ! "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "Invalid extension version: $VERSION" >&2
            exit 1
          fi
          if [[ ! "$TEMPLATE_VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "Invalid template version: $TEMPLATE_VERSION" >&2
            exit 1
          fi
          for notes in "$NOTES_DE" "$NOTES_EN" "$NOTES_NL"; do
            if [[ ! -s "$notes" ]]; then
              echo "Missing or empty translated release notes: $notes" >&2
              exit 1
            fi
          done

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "template_version=$TEMPLATE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "notes_de=$NOTES_DE" >> "$GITHUB_OUTPUT"
          echo "notes_en=$NOTES_EN" >> "$GITHUB_OUTPUT"
          echo "notes_nl=$NOTES_NL" >> "$GITHUB_OUTPUT"

      - name: Check whether release assets need publishing
        id: release_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          TEMPLATE_CHANGED: ${{ steps.template_changes.outputs.changed }}
        shell: bash
        run: |
          set -euo pipefail

          if ASSETS="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null)"; then
            RELEASE_EXISTS=true
          else
            ASSETS=""
            RELEASE_EXISTS=false
          fi

          MISSING=false
          for asset in \
            "Schleim-OS-Extension.zip" \
            "Browser-OS-Extension-Template.zip" \
            "Schleim-OS-SHA256SUMS.txt"; do
            if ! printf '%s\n' "$ASSETS" | grep -Fxq "$asset"; then
              echo "Release asset missing: $asset"
              MISSING=true
            fi
          done

          if [[ "$RELEASE_EXISTS" == "true" && "$MISSING" == "false" && "$TEMPLATE_CHANGED" == "true" ]]; then
            MODE=template
            echo "The template changed. Only its release ZIP and the checksum file will be replaced."
          elif [[ "$RELEASE_EXISTS" == "true" && "$MISSING" == "false" ]]; then
            MODE=none
            echo "This version already has all assets and the template has not changed."
          elif [[ "$RELEASE_EXISTS" == "true" ]]; then
            MODE=repair
            echo "An existing release is missing assets and will be repaired."
          else
            MODE=create
            echo "No release exists for this version. A new release will be created."
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "release_exists=$RELEASE_EXISTS" >> "$GITHUB_OUTPUT"

      - name: Build release ZIP packages
        if: steps.release_check.outputs.mode != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          MODE: ${{ steps.release_check.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release

          if [[ "$MODE" == "template" ]]; then
            # Preserve the already-published original extension package byte-for-byte.
            gh release download "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "Schleim-OS-Extension.zip" \
              --dir dist/release

            (cd extension-template && zip -qr "$GITHUB_WORKSPACE/dist/release/Browser-OS-Extension-Template.zip" .)
          else
            (cd extension && zip -qr "$GITHUB_WORKSPACE/dist/release/Schleim-OS-Extension.zip" .)
            (cd extension-template && zip -qr "$GITHUB_WORKSPACE/dist/release/Browser-OS-Extension-Template.zip" .)
          fi

          # Both packages must have an active manifest.json at their archive root.
          unzip -Z1 dist/release/Schleim-OS-Extension.zip | sed 's#^\./##' | grep -Fxq 'manifest.json'
          unzip -Z1 dist/release/Browser-OS-Extension-Template.zip | sed 's#^\./##' | grep -Fxq 'manifest.json'

          # The template ZIP must not contain the obsolete renamed manifest.
          if unzip -Z1 dist/release/Browser-OS-Extension-Template.zip | sed 's#^\./##' | grep -Fxq 'manifest.template.json'; then
            echo "The template ZIP still contains manifest.template.json." >&2
            exit 1
          fi

          (
            cd dist/release
            sha256sum Schleim-OS-Extension.zip Browser-OS-Extension-Template.zip > Schleim-OS-SHA256SUMS.txt
          )

      - name: Assemble German, English and Dutch release description
        if: steps.release_check.outputs.mode == 'create' || steps.release_check.outputs.mode == 'repair'
        env:
          NOTES_DE: ${{ steps.version.outputs.notes_de }}
          NOTES_EN: ${{ steps.version.outputs.notes_en }}
          NOTES_NL: ${{ steps.version.outputs.notes_nl }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          {
            printf '## 🇩🇪 Deutsch\n\n'
            cat "$NOTES_DE"
            printf '\n\n---\n\n## 🇬🇧 English\n\n'
            cat "$NOTES_EN"
            printf '\n\n---\n\n## 🇳🇱 Nederlands\n\n'
            cat "$NOTES_NL"
            printf '\n'
          } > dist/release/ReleaseNotes.md
          test -s dist/release/ReleaseNotes.md
          echo "Combined trilingual release description prepared."

      - name: Create new GitHub Release
        if: steps.release_check.outputs.mode == 'create'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ github.workspace }}/dist/release/ReleaseNotes.md
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "dist/release/Schleim-OS-Extension.zip" \
            "dist/release/Browser-OS-Extension-Template.zip" \
            "dist/release/Schleim-OS-SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Schleim OS $VERSION" \
            --notes-file "$NOTES" \
            --target "$GITHUB_SHA"

      - name: Repair an existing release with missing assets
        if: steps.release_check.outputs.mode == 'repair'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ github.workspace }}/dist/release/ReleaseNotes.md
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Schleim OS $VERSION" \
            --notes-file "$NOTES"
          gh release delete-asset "$TAG" "Schleim-OS-Extension-Template.zip" --repo "$GITHUB_REPOSITORY" --yes || true

          gh release upload "$TAG" \
            "dist/release/Schleim-OS-Extension.zip" \
            "dist/release/Browser-OS-Extension-Template.zip" \
            "dist/release/Schleim-OS-SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Publish updated template without touching the original extension
        if: steps.release_check.outputs.mode == 'template'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete-asset "$TAG" "Schleim-OS-Extension-Template.zip" --repo "$GITHUB_REPOSITORY" --yes || true
          gh release upload "$TAG" \
            "dist/release/Browser-OS-Extension-Template.zip" \
            "dist/release/Schleim-OS-SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Report that no release update is needed
        if: steps.release_check.outputs.mode == 'none'
        shell: bash
        run: echo "No new version or missing release asset was found. Nothing was changed."
