name: Build and publish Schleim OS release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'extension/**'
      - 'extension-template/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schleim-os-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          python3 -m json.tool extension/manifest.json > /dev/null
          python3 -m json.tool extension-template/manifest.template.json > /dev/null
          VERSION="$(python3 -c 'import json; print(json.load(open("extension/manifest.json", encoding="utf-8"))["version"])')"
          NOTES="extension/docs/RELEASE-NOTES-${VERSION}.md"
          if [[ ! "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "Invalid extension version: $VERSION" >&2
            exit 1
          fi
          if [[ ! -f "$NOTES" ]]; then
            echo "Missing release notes: $NOTES" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Build separate ZIP packages
        shell: bash
        run: |
          mkdir -p dist/release
          (cd extension && zip -qr "$GITHUB_WORKSPACE/dist/release/Schleim-OS-Extension.zip" .)
          (cd extension-template && zip -qr "$GITHUB_WORKSPACE/dist/release/Schleim-OS-Extension-Template.zip" .)
          (
            cd dist/release
            sha256sum Schleim-OS-Extension.zip Schleim-OS-Extension-Template.zip > Schleim-OS-SHA256SUMS.txt
          )

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.version.outputs.notes }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; no duplicate release was created."
            exit 0
          fi

          gh release create "$TAG" \
            "dist/release/Schleim-OS-Extension.zip" \
            "dist/release/Schleim-OS-Extension-Template.zip" \
            "dist/release/Schleim-OS-SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Schleim OS $VERSION" \
            --notes-file "$NOTES" \
            --target "$GITHUB_SHA"
