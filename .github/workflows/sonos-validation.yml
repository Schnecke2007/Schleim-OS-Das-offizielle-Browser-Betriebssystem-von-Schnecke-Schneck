name: Validate Schleim OS app navigation and Store web apps

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sonos-validation.yml'
      - 'extension/scripts/app.js'
      - 'extension/scripts/personalization.js'
      - 'extension/pages/newtab.html'
      - 'extension/styles/personalization.css'
      - 'extension/manifest.json'
      - 'extension/data/store-apps.json'
      - 'Store/media/sonos-control.json'
      - 'Store/media/README.md'
      - 'extension/standalone/schleim-os-standalone.html'
      - 'extension/tests/**'
  pull_request:
    paths:
      - '.github/workflows/sonos-validation.yml'
      - 'extension/scripts/app.js'
      - 'extension/scripts/personalization.js'
      - 'extension/pages/newtab.html'
      - 'extension/styles/personalization.css'
      - 'extension/manifest.json'
      - 'extension/data/store-apps.json'
      - 'Store/media/sonos-control.json'
      - 'Store/media/README.md'
      - 'extension/standalone/schleim-os-standalone.html'
      - 'extension/tests/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check extension/scripts/app.js
          node --check extension/scripts/personalization.js
      - name: Check app navigation regressions
        run: node --test extension/tests/*.test.js
      - name: Validate JSON files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('extension/data/store-apps.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('Store/media/sonos-control.json','utf8'))"
