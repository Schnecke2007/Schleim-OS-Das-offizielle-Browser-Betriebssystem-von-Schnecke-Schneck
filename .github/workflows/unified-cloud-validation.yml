name: Validate unified Schleim Cloud

on:
  pull_request:
    branches: [main]
    paths:
      - 'extension/scripts/**'
      - 'extension/tests/**'
      - 'extension/docs/**'
      - 'android/app/src/main/java/**'
      - '.github/workflows/unified-cloud-validation.yml'

permissions:
  contents: read

concurrency:
  group: unified-cloud-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  extension:
    name: Validate extension JavaScript and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in extension/scripts/*.js; do
            node --check "$file"
          done
      - name: Run Schleim OS extension tests
        run: node --test extension/tests/app-navigation.test.js

  android:
    name: Compile Android browser
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Bundle the current extension into the Android app
        shell: bash
        run: |
          set -euo pipefail
          ASSET_DIR="android/app/src/main/assets/extension"
          rm -rf "$ASSET_DIR"
          mkdir -p "$ASSET_DIR"
          cp -a extension/. "$ASSET_DIR/"
      - name: Compile Android debug APK (validation only)
        working-directory: android
        run: gradle --no-daemon --stacktrace -PgeckoviewVersion=153.0.20260810162159 :app:assembleDebug
