<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="referrer" content="no-referrer">
<title>Schleim OS lokale Kamera</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}
video{display:block;width:100%;height:100%;object-fit:cover;background:#050505}
.hint{position:absolute;left:10px;right:10px;bottom:10px;color:#fff;background:#0009;padding:7px 9px;border-radius:8px;font:11px/1.4 system-ui,sans-serif}
</style>
</head>
<body>
<video id="preview" autoplay muted playsinline></video>
<div class="hint" id="hint">Lokale Kamera ist bereit.</div>
<script>
(() => {
'use strict';
const CHANNEL='schleim-os-camera';
const preview=document.getElementById('preview');
const hint=document.getElementById('hint');
let stream=null,recorder=null,chunks=[],parentOrigin=null;
function notifyStatus(message){hint.textContent=message;if(parentOrigin)parent.postMessage({channel:CHANNEL,type:'status',message:String(message)},parentOrigin);}
function reply(requestId,ok,extra={}){if(parentOrigin)parent.postMessage(Object.assign({channel:CHANNEL,type:'response',requestId,ok},extra),parentOrigin);}
function stopTracks(){
 if(recorder&&recorder.state!=='inactive'){try{recorder.ondataavailable=null;recorder.onstop=null;recorder.stop();}catch{}}
 recorder=null;chunks=[];stream?.getTracks?.().forEach(track=>track.stop());stream=null;preview.srcObject=null;
}
async function startCamera(facingMode){
 stopTracks();
 if(!window.isSecureContext)throw new DOMException('Lokaler Kamera-Kontext ist nicht sicher.','SecurityError');
 if(!navigator.mediaDevices?.getUserMedia)throw new DOMException('getUserMedia ist in diesem Browser nicht verfügbar.','NotSupportedError');
 const attempts=[
  {audio:false,video:{facingMode:{ideal:facingMode||'environment'},width:{ideal:1920},height:{ideal:1080}}},
  {audio:false,video:{facingMode:{ideal:facingMode||'environment'}}},
  {audio:false,video:true}
 ];
 let lastError=null;
 for(let index=0;index<attempts.length;index++){
  try{stream=await navigator.mediaDevices.getUserMedia(attempts[index]);break;}
  catch(error){lastError=error;if(!['NotFoundError','DevicesNotFoundError','OverconstrainedError','ConstraintNotSatisfiedError','TypeError'].includes(error?.name)||index===attempts.length-1)throw error;}
 }
 if(!stream)throw lastError||new DOMException('Keine Kamera verfügbar.','NotFoundError');
 preview.srcObject=stream;await preview.play();
 return {deviceName:stream.getVideoTracks()[0]?.label||'Kamera aktiv'};
}
async function takePhoto(){
 if(!stream||!preview.videoWidth)throw new DOMException('Kamera ist noch nicht bereit.','InvalidStateError');
 const canvas=document.createElement('canvas');canvas.width=preview.videoWidth;canvas.height=preview.videoHeight;
 const context=canvas.getContext('2d');if(!context)throw new Error('Foto-Canvas konnte nicht erstellt werden.');
 context.drawImage(preview,0,0,canvas.width,canvas.height);
 const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.9));
 canvas.width=0;canvas.height=0;if(!blob)throw new Error('Foto konnte nicht erstellt werden.');return blob;
}
function startRecording(){
 if(!stream)throw new DOMException('Kamera ist noch nicht gestartet.','InvalidStateError');
 if(typeof MediaRecorder==='undefined')throw new DOMException('Videoaufnahme wird nicht unterstützt.','NotSupportedError');
 const mimeType=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'].find(type=>MediaRecorder.isTypeSupported?.(type));
 chunks=[];recorder=new MediaRecorder(stream,mimeType?{mimeType}:undefined);
 recorder.addEventListener('dataavailable',event=>{if(event.data?.size)chunks.push(event.data);});
 recorder.start(1000);return {mimeType:recorder.mimeType||mimeType||'video/webm'};
}
function stopRecording(){
 if(!recorder||recorder.state==='inactive')throw new DOMException('Es läuft keine Videoaufnahme.','InvalidStateError');
 const activeRecorder=recorder;
 return new Promise((resolve,reject)=>{
  activeRecorder.addEventListener('error',event=>reject(event.error||new Error('Videoaufnahme fehlgeschlagen.')),{once:true});
  activeRecorder.addEventListener('stop',()=>{
   const blob=new Blob(chunks,{type:activeRecorder.mimeType||'video/webm'});chunks=[];recorder=null;
   if(!blob.size)reject(new Error('Videoaufnahme ist leer.'));else resolve(blob);
  },{once:true});
  activeRecorder.stop();
 });
}
window.addEventListener('message',async event=>{
 if(event.source!==window.parent||!String(event.origin||'').startsWith('moz-extension://'))return;
 const message=event.data;
 if(!message||message.channel!==CHANNEL||!message.requestId)return;
 parentOrigin=event.origin;
 try{
  let value=true;
  switch(message.action){
   case 'start':value=await startCamera(message.facingMode||'environment');notifyStatus('Kamera ist bereit.');break;
   case 'photo':value=await takePhoto();break;
   case 'record-start':value=startRecording();notifyStatus('Videoaufnahme läuft …');break;
   case 'record-stop':value=await stopRecording();notifyStatus('Videoaufnahme beendet.');break;
   case 'stop':stopTracks();notifyStatus('Kamera gestoppt.');break;
   default:throw new Error('Unbekannter Kamera-Befehl.');
  }
  reply(message.requestId,true,{value:value instanceof Blob?undefined:value,blob:value instanceof Blob?value:undefined});
 }catch(error){notifyStatus(error?.message||'Kamerafehler.');reply(message.requestId,false,{error:{name:error?.name||'Error',message:error?.message||'Kamera fehlgeschlagen.'}});}
});
window.addEventListener('pagehide',stopTracks);
parent.postMessage({channel:CHANNEL,type:'ready'},'*');
})();
</script>
</body></html>
