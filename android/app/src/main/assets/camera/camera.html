<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#251205">
<title>Schleim OS – Webkamera</title>
<style>
:root{color-scheme:dark;--bg:#120b07;--panel:#251205;--accent:#d5a66d;--text:#fff7ed;--muted:#d2c1af;--line:#65452e;--danger:#b94c3d}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Roboto,sans-serif}
body{display:flex;flex-direction:column;min-height:100%;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#1e1008;border-bottom:1px solid var(--line)}
.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--panel);font-size:24px}
.heading{min-width:0;flex:1}h1{font-size:17px;margin:0 0 3px}.sub{font-size:12px;color:var(--muted)}
.preview-wrap{position:relative;flex:1;min-height:220px;background:#000;display:grid;place-items:center;overflow:hidden}
video{width:100%;height:100%;object-fit:cover;background:#000}
.live{position:absolute;top:14px;left:14px;border-radius:99px;padding:6px 10px;background:#a52f28;color:#fff;font-size:11px;font-weight:800;letter-spacing:.08em;display:none}
.preview-message{position:absolute;inset:auto 18px 18px;text-align:center;color:#fff;background:#130c08c9;border:1px solid #ffffff20;border-radius:14px;padding:12px;font-size:13px}
.controls{padding:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;background:#1b100a}
button{min-height:50px;border:1px solid var(--line);border-radius:14px;padding:11px 14px;background:#3b2414;color:var(--text);font-size:14px;font-weight:700}
button.primary{background:var(--accent);border-color:var(--accent);color:#241306}button:disabled{opacity:.45}button.full{grid-column:1/-1}
.status{min-height:42px;padding:8px 16px 14px;background:#1b100a;color:var(--muted);font-size:13px;text-align:center}
.settings{display:none;text-decoration:underline;color:var(--accent);background:none;border:0;min-height:auto;padding:0;margin:0 auto 14px}
@media(min-width:700px){.preview-wrap{max-height:70vh}.controls{grid-template-columns:repeat(3,minmax(0,1fr));max-width:850px;width:100%;margin:0 auto}}
</style>
</head>
<body>
<header>
  <div class="logo">🐌</div>
  <div class="heading"><h1>Schleim OS · Webkamera</h1><div class="sub" id="modeLabel">Kamera wird vorbereitet …</div></div>
  <button type="button" id="cancelButton" aria-label="Schließen">✕</button>
</header>
<main class="preview-wrap">
  <video id="preview" autoplay muted playsinline></video>
  <span class="live" id="liveBadge">LIVE</span>
  <div class="preview-message" id="previewMessage">Die Webkamera wird geöffnet …</div>
</main>
<section class="controls">
  <button type="button" id="retryButton" class="primary full">Kamera erneut starten</button>
  <button type="button" id="switchButton" disabled>↔ Kamera wechseln</button>
  <button type="button" id="photoButton" class="primary">📷 Foto aufnehmen</button>
  <button type="button" id="recordButton" class="primary">● Video aufnehmen</button>
  <button type="button" id="stopButton" disabled>■ Kamera stoppen</button>
</section>
<div class="status" id="status" role="status" aria-live="polite">Kamera wird geöffnet …</div>
<button type="button" id="settingsButton" class="settings">Android-App-Berechtigungen öffnen</button>
<script>
(() => {
'use strict';
const bridge=window.AndroidCamera;
const mode=new URLSearchParams(location.search).get('mode')==='video'?'video':'photo';
const preview=document.getElementById('preview'),status=document.getElementById('status'),message=document.getElementById('previewMessage');
const liveBadge=document.getElementById('liveBadge'),retryButton=document.getElementById('retryButton'),switchButton=document.getElementById('switchButton');
const photoButton=document.getElementById('photoButton'),recordButton=document.getElementById('recordButton'),stopButton=document.getElementById('stopButton');
const settingsButton=document.getElementById('settingsButton');
let cameraStream=null,microphoneStream=null,recorder=null,recordedChunks=[],facingMode='environment',busy=false;

document.getElementById('modeLabel').textContent=mode==='video'?'Videoaufnahme · Rück- und Frontkamera':'Fotoaufnahme · Rück- und Frontkamera';
photoButton.hidden=mode!=='photo';recordButton.hidden=mode!=='video';
function setStatus(value,error=false){status.textContent=value;status.classList.toggle('error',error);settingsButton.style.display=error?'block':'none';}
function explainCameraError(error){
 const name=error?.name||'CameraError',detail=error?.message||'';
 const messages={
  NotAllowedError:'Der Kamerazugriff wurde nicht freigegeben. Prüfe die Android-Berechtigung für Schleim OS.',
  PermissionDeniedError:'Der Kamerazugriff wurde abgelehnt. Erlaube die Kamera in den Android-App-Berechtigungen.',
  NotFoundError:'Das Gerät meldet keine verfügbare Kamera.',
  NotReadableError:'Die Kamera ist belegt oder kann vom Android-System nicht geöffnet werden.',
  OverconstrainedError:'Die ausgewählte Kamera unterstützt die angeforderten Einstellungen nicht.',
  SecurityError:'Der sichere Webkamera-Kontext wurde vom Browser abgelehnt.',
  TypeError:'Die Webkamera-API ist in diesem WebView nicht verfügbar.'
 };
 return messages[name]||('Webkamera-Fehler '+name+': '+detail);
}
function stopTracks(stream){stream?.getTracks?.().forEach(track=>track.stop());}
async function stopMicrophone(){stopTracks(microphoneStream);microphoneStream=null;}
async function stopCamera(){
 if(recorder&&recorder.state!=='inactive'){await new Promise(resolve=>{recorder.addEventListener('stop',resolve,{once:true});recorder.stop();});}
 recorder=null;recordedChunks=[];await stopMicrophone();stopTracks(cameraStream);cameraStream=null;preview.srcObject=null;
 liveBadge.style.display='none';switchButton.disabled=true;photoButton.disabled=true;recordButton.disabled=true;stopButton.disabled=true;
}
async function startCamera(){
 if(busy)return;busy=true;retryButton.disabled=true;setStatus('Die Webkamera wird initialisiert …');
 message.textContent='Bitte erlaube den Kamerazugriff, falls Android danach fragt.';
 try{
  await stopCamera();
  if(!window.isSecureContext)throw new TypeError('Die Kameraseite ist kein sicherer HTTPS-Kontext.');
  if(!navigator.mediaDevices?.getUserMedia)throw new TypeError('navigator.mediaDevices.getUserMedia ist in diesem WebView nicht verfügbar.');
  let stream=null,lastError=null;
  const attempts=[
   {video:{facingMode:{ideal:facingMode},width:{ideal:1280},height:{ideal:720}},audio:false},
   {video:true,audio:false}
  ];
  for(const constraints of attempts){
   try{stream=await navigator.mediaDevices.getUserMedia(constraints);break;}
   catch(error){lastError=error;if(['NotAllowedError','PermissionDeniedError','NotReadableError','SecurityError'].includes(error?.name))throw error;}
  }
  if(!stream)throw lastError||new Error('Die Webkamera konnte nicht geöffnet werden.');
  cameraStream=stream;preview.srcObject=stream;await preview.play();liveBadge.style.display='inline-block';message.textContent='';
  switchButton.disabled=false;photoButton.disabled=mode!=='photo';recordButton.disabled=mode!=='video';stopButton.disabled=false;
  setStatus('Webkamera aktiv · '+(facingMode==='environment'?'Rückkamera':'Frontkamera'));
 }catch(error){message.textContent=explainCameraError(error);setStatus(explainCameraError(error),true);console.error('Schleim OS Web camera failed',error);}
 finally{busy=false;retryButton.disabled=false;}
}
async function switchCamera(){facingMode=facingMode==='environment'?'user':'environment';await startCamera();}
async function saveBlob(blob,preferredName){
 if(!bridge||!blob?.size)throw new Error('Die Android-Dateiübergabe ist nicht verfügbar.');
 if(blob.size>50*1024*1024)throw new Error('Die Aufnahme ist größer als 50 MiB.');
 const mimeType=blob.type.startsWith('video/')?blob.type.split(';')[0]:'image/jpeg';
 const extension=mimeType==='video/webm'?'webm':mimeType==='video/mp4'?'mp4':'jpg';
 const safeName=preferredName||('Schleim-Kamera-'+Date.now()+'.'+extension);
 if(!bridge.beginCapture(safeName,mimeType,blob.size))throw new Error('Die temporäre Datei konnte nicht vorbereitet werden.');
 const bytes=new Uint8Array(await blob.arrayBuffer()),chunkSize=24*1024;
 for(let offset=0;offset<bytes.length;offset+=chunkSize){
  const chunk=bytes.subarray(offset,Math.min(offset+chunkSize,bytes.length));let binary='';
  for(let i=0;i<chunk.length;i+=0x8000)binary+=String.fromCharCode(...chunk.subarray(i,Math.min(i+0x8000,chunk.length)));
  if(!bridge.appendCaptureChunk(btoa(binary)))throw new Error('Die Aufnahme konnte nicht vollständig übertragen werden.');
 }
 if(!bridge.finishCapture())throw new Error('Die Aufnahme konnte nicht gespeichert werden.');
 setStatus('Aufnahme gespeichert. Schleim OS übernimmt jetzt den Cloud-Upload …');
}
async function takePhoto(){
 if(!cameraStream||!preview.videoWidth)throw new Error('Die Live-Kamera ist noch nicht bereit.');
 const canvas=document.createElement('canvas');canvas.width=preview.videoWidth;canvas.height=preview.videoHeight;
 const context=canvas.getContext('2d');if(!context)throw new Error('Das Kamerabild konnte nicht verarbeitet werden.');
 context.drawImage(preview,0,0,canvas.width,canvas.height);
 const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.92));canvas.width=0;canvas.height=0;
 if(!blob)throw new Error('Das Foto konnte nicht erstellt werden.');
 setStatus('Foto wird gespeichert …');await saveBlob(blob,'Schleim-Kamera-'+Date.now()+'.jpg');
}
async function startRecording(){
 if(!cameraStream)throw new Error('Die Live-Kamera ist noch nicht bereit.');
 if(typeof MediaRecorder==='undefined')throw new Error('MediaRecorder wird in diesem WebView nicht unterstützt.');
 setStatus('Mikrofonberechtigung wird angefordert …');
 microphoneStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:false});
 const recordingStream=new MediaStream([...cameraStream.getVideoTracks(),...microphoneStream.getAudioTracks()]);
 const candidates=['video/webm;codecs=vp8,opus','video/webm;codecs=vp8','video/webm','video/mp4'];
 const mimeType=candidates.find(type=>MediaRecorder.isTypeSupported?.(type));
 recordedChunks=[];recorder=new MediaRecorder(recordingStream,mimeType?{mimeType}:undefined);
 recorder.addEventListener('dataavailable',event=>{if(event.data?.size)recordedChunks.push(event.data);});
 recorder.addEventListener('error',event=>setStatus(explainCameraError(event.error||event),true));
 recorder.addEventListener('stop',async()=>{
  const actualType=recorder?.mimeType||mimeType||'video/webm';
  const blob=new Blob(recordedChunks,{type:actualType.split(';')[0]});recorder=null;recordedChunks=[];await stopMicrophone();
  try{if(!blob.size)throw new Error('Die Videoaufnahme ist leer.');setStatus('Video wird gespeichert …');await saveBlob(blob,'Schleim-Kamera-Video-'+Date.now()+(blob.type==='video/mp4'?'.mp4':'.webm'));}
  catch(error){setStatus(error.message||'Video konnte nicht gespeichert werden.',true);}
 });
 recorder.start(1000);recordButton.textContent='■ Aufnahme beenden';stopButton.disabled=true;switchButton.disabled=true;setStatus('Videoaufnahme läuft …');
}
function stopRecording(){if(!recorder||recorder.state==='inactive')return;recordButton.disabled=true;setStatus('Video wird beendet und gespeichert …');recorder.stop();}
document.getElementById('cancelButton').addEventListener('click',()=>bridge?.cancelCapture?.());
retryButton.addEventListener('click',startCamera);switchButton.addEventListener('click',switchCamera);
photoButton.addEventListener('click',async()=>{photoButton.disabled=true;try{await takePhoto();}catch(error){setStatus(error.message||'Fotoaufnahme fehlgeschlagen.',true);photoButton.disabled=false;}});
recordButton.addEventListener('click',async()=>{
 if(recorder&&recorder.state!=='inactive'){stopRecording();return;}
 recordButton.disabled=true;
 try{await startRecording();recordButton.disabled=false;}
 catch(error){await stopMicrophone();setStatus(explainCameraError(error),true);recordButton.textContent='● Video aufnehmen';recordButton.disabled=false;}
});
stopButton.addEventListener('click',async()=>{await stopCamera();message.textContent='Kamera gestoppt. Tippe auf „Kamera erneut starten“.';setStatus('Kamera gestoppt.');retryButton.disabled=false;});
settingsButton.addEventListener('click',()=>bridge?.openAppSettings?.());
window.addEventListener('load',()=>startCamera());
})();
</script>
</body>
</html>
